# .github/workflows/ci.yml

name: CI Pipeline

on:
  push:
    branches: [ main ] 
  pull_request:
    branches: [ main ] 
  workflow_dispatch:

jobs:
  test-and-validate: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check if required files exist 
        run: |
          ls -l # List files for debugging
          test -f app.py && echo "app.py found."
          test -f requirements.txt && echo "requirements.txt found."
          test -f iris_model.pkl && echo "iris_model.pkl found."
          test -f iris_target_names.pkl && echo "iris_target_names.pkl found."


      - name: Load model using Python
        run: |
          python -c "import joblib; \
                     print('Attempting to load model...'); \
                     model = joblib.load('iris_model.pkl'); \
                     target_names = joblib.load('iris_target_names.pkl'); \
                     print('Model and target names loaded successfully!')"
